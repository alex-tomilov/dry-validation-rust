[[audits.unarray]]
who = "OpenAI Codex (AI-assisted source review)"
criteria = "safe-to-run"
version = "0.1.4"
notes = "Reviewed array construction and initialization paths. Work is confined to process memory; no external I/O or process operations were found."

[[audits.wasi]]
who = "OpenAI Codex (AI-assisted source review)"
criteria = "safe-to-run"
version = "0.11.1+wasi-snapshot-preview1"
