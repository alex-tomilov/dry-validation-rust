version: 1
repository: alex-tomilov/dry-validation-rust
integration_branch: develop
labels_file: .github/labels.yml

project:
  owner: alex-tomilov
  owner_type: user
  title: dry-validation-rust roadmap
  short_description: Safe core, executable compatibility, packaging, and measured adoption
  readme: |
    <!-- dvr-project-management:v1 -->

    This project is synchronized from `.github/project-management.yml`.
    Work is grouped into a compact set of outcome-oriented stages.
  public: true
  workflow_field: Status
  workflow_options:
    - name: Backlog
      color: GRAY
      description: Valid issue not selected for active work
    - name: Ready
      color: BLUE
      description: Scoped, unblocked, and ready to implement
    - name: In progress
      color: YELLOW
      description: Actively being implemented
    - name: Review
      color: PURPLE
      description: Pull request open with verification evidence
    - name: Blocked
      color: RED
      description: Waiting on a named dependency or decision
    - name: Done
      color: GREEN
      description: Acceptance criteria met and merged
  view:
    name: Roadmap board
    layout: board
    filter: "is:issue"

milestones:
  - title: 0.1 prerelease - safe core
    description: Prove a safe supported subset and source package before publication.
  - title: 0.2-0.3 - evidence and adoption
    description: Broaden evidence, verify delivery paths, and add measured adoption support.
  - title: Future - batch and streaming experiments
    description: Evaluate optional Rust-owned processing without blocking the normal API.

roadmap:
