version: 1
repository: alex-tomilov/dry-validation-rust
integration_branch: main
labels_file: .github/labels.yml

project:
  owner: alex-tomilov
  owner_type: user
  title: dry-validation-rust roadmap
  short_description: Correctness, compatibility, packaging, and release-readiness roadmap
  readme: |
    <!-- dvr-project-management:v1 -->

    This project is synchronized from `.github/project-management.yml`.
    Repository issues are grouped by the managed Status field.
  public: true
  workflow_field: Status
  workflow_options:
    - name: Backlog
      color: GRAY
      description: Valid issue not selected for active work
    - name: Ready
      color: BLUE
      description: Scoped, unblocked, and ready to implement
    - name: In progress
      color: YELLOW
      description: Actively being implemented
    - name: Review
      color: PURPLE
      description: Pull request open with verification evidence
    - name: Blocked
      color: RED
      description: Waiting on a named dependency or decision
    - name: Done
      color: GREEN
      description: Acceptance criteria met and merged
  view:
    name: Roadmap board
    layout: board
    filter: "is:issue"

milestones:
  - title: 0.1 alpha - correctness foundation
    description: Resolve correctness and compatibility-claim blockers for the first public alpha.
  - title: 0.1 beta - compatibility and benchmark evidence
    description: Build broad differential, robustness, maintainability, and measured-performance evidence.
  - title: 0.1 RC - native packaging and release readiness
    description: Validate native artifacts, release automation, operations, and rollback.
  - title: 1.0 - stable API and support policy
    description: Commit to a supportable stable subset and lifecycle policy.
  - title: Future - experimental batch API
    description: Evaluate an opt-in Rust-owned batch path without delaying the core engine.

