- name: "status:needs-design"
  color: "fef2c0"
  description: "Problem is accepted but design or scope is not ready"
- name: "status:good-first-issue"
  color: "7057ff"
  description: "Small, bounded task suitable for a new contributor"

- name: "breaking-change"
  color: "b60205"
  description: "Intentionally changes an existing public contract"
- name: "upstream-difference"
  color: "5319e7"
