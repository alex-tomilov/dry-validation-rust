- name: "type:bug"
  color: "d73a4a"
  description: "Incorrect behavior in the documented supported surface"
- name: "type:compatibility"
  color: "5319e7"
  description: "Difference from the pinned upstream compatibility target"
- name: "type:performance"
  color: "0052cc"
  description: "Benchmark, allocation, memory, or performance regression work"
- name: "type:feature"
  color: "0e8a16"
  description: "New user-facing capability or supported surface"
- name: "type:documentation"
  color: "0075ca"
  description: "Documentation-only change"
- name: "type:security"
  color: "b60205"
  description: "Security hardening or a coordinated private advisory"
- name: "type:maintenance"
  color: "fbca04"
  description: "Repository, dependency, tooling, or maintenance work"

- name: "priority:p0"
  color: "b60205"
  description: "Release-blocking correctness, security, or data-safety work"
- name: "priority:p1"
  color: "d93f0b"
  description: "Important milestone work that should be scheduled next"
- name: "priority:p2"
  color: "fbca04"
  description: "Valuable work that is not on the current critical path"
- name: "priority:p3"
  color: "c5def5"
  description: "Future, exploratory, or intentionally deferred work"

