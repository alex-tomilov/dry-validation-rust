name: Package

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gem:
    name: Source gem audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo rm -f /etc/apt/sources.list.d/*.list && sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 clang libclang-dev

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
          cache-workspaces: ext/dry_validation_rust -> target

      - name: Audit source package and clean install
        run: bundle exec rake package:audit

      - name: Audit gem contents
        run: |
          script/update-gem-contents gem_contents.txt
          diff -u expected_gem_contents.txt gem_contents.txt

      - name: Upload built source gem
        uses: actions/upload-artifact@v7
        with:
          name: dry-validation-rust-source-gem
          path: pkg/*.gem
          if-no-files-found: error
