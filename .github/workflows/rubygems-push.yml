name: rubygems:push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: rubygems-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release tag and full CI gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Verify tag matches gem version
        run: |
          VERSION=$(bundle exec ruby -Ilib -e 'require "dry/validation/rust/version"; print Dry::Validation::Rust::VERSION')
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run full verification gate
        run: script/verify

  build-source-gem:
    name: Build and sign source gem
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build source gem
        run: |
          mkdir -p pkg
          gem build dry-validation-rust.gemspec --output "pkg/dry-validation-rust-$(bundle exec ruby -Ilib -e 'require "dry/validation/rust/version"; print Dry::Validation::Rust::VERSION').gem"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign source gem with Sigstore
        run: |
          for artifact in pkg/*.gem; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done

      - name: Upload signed source gem
        uses: actions/upload-artifact@v7
        with:
          name: dry-validation-rust-source-release
          path: |
            pkg/*.gem
            pkg/*.sigstore.json
          if-no-files-found: error

  build-native-gem:
    name: Build and sign ${{ matrix.platform }} gem
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - aarch64-linux
          - x86_64-darwin
          - arm64-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build native platform gem
        run: |
          GEM_VERSION=$(bundle exec ruby -Ilib -e 'require "dry/validation/rust/version"; print Dry::Validation::Rust::VERSION')
          bundle exec rb-sys-dock --platform ${{ matrix.platform }} --ruby-versions 3.3 -- "bundle exec rake native:\$RUBY_TARGET pkg/dry-validation-rust-${GEM_VERSION}-\$RUBY_TARGET.gem"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign native gem with Sigstore
        run: |
          for artifact in pkg/*.gem; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done

      - name: Upload signed native gem
        uses: actions/upload-artifact@v7
        with:
          name: dry-validation-rust-${{ matrix.platform }}-release
          path: |
            pkg/*.gem
            pkg/*.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish signed gems to RubyGems.org
    needs:
      - build-source-gem
      - build-native-gem
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Download signed release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: dry-validation-rust-*-release
          path: pkg
          merge-multiple: true

      - name: Configure RubyGems trusted-publishing credentials
        uses: rubygems/configure-rubygems-credentials@v2

      - name: Push built gems to RubyGems.org
        run: |
          for artifact in pkg/*.gem; do
            gem push "${artifact}"
          done
