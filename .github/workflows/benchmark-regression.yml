name: Benchmark Regression

on:
  pull_request:
    paths:
      - 'benchmark/**'
      - 'ext/dry_validation_rust/Cargo.lock'
      - 'ext/dry_validation_rust/Cargo.toml'
      - 'ext/dry_validation_rust/src/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'dry-validation-rust.gemspec'
      - 'lib/**'
      - 'rust-toolchain.toml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'benchmark/**'
      - 'ext/dry_validation_rust/Cargo.lock'
      - 'ext/dry_validation_rust/Cargo.toml'
      - 'ext/dry_validation_rust/src/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'dry-validation-rust.gemspec'
      - 'lib/**'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      publish_dashboard:
        description: Update the gh-pages benchmark baseline and dashboard
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: benchmark-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Schema throughput regression gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo rm -f /etc/apt/sources.list.d/*.list && sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true && sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 clang libclang-dev

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Install pinned upstream benchmark dependency
        run: gem install dry-validation --version 1.11.1 --no-document

      - name: Run schema throughput benchmark
        run: FORMAT=github-action-benchmark ruby -Ilib benchmark/schema_throughput.rb > benchmark_results.json

      - name: Check for benchmark baseline
        id: benchmark-baseline
        run: |
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Compare benchmark results
        if: steps.benchmark-baseline.outputs.available == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Schema throughput p95 latency
          tool: customSmallerIsBetter
          output-file-path: benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: 105%
          fail-threshold: 105%
          fail-on-alert: true
          auto-push: false

      - name: Upload benchmark results for trusted dashboard publishing
        uses: actions/upload-artifact@v7
        with:
          name: schema-throughput-results
          path: benchmark_results.json
          if-no-files-found: error

  publish-dashboard:
    name: Publish trusted benchmark dashboard
    needs: benchmark
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_dashboard)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          name: schema-throughput-results
          path: ${{ runner.temp }}/schema-throughput-results

      - name: Initialize benchmark dashboard branch
        run: |
          if ! git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git checkout --orphan gh-pages
            git rm -rf .
            touch .nojekyll
            git add .nojekyll
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'chore: initialize benchmark dashboard'
            git push origin gh-pages
          fi
          git checkout --detach "$GITHUB_SHA"

      - name: Update benchmark dashboard
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Schema throughput p95 latency
          tool: customSmallerIsBetter
          output-file-path: ${{ runner.temp }}/schema-throughput-results/benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: 105%
          fail-threshold: 105%
          fail-on-alert: true
          auto-push: true
