name: Benchmark Regression

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      publish_dashboard:
        description: Update the gh-pages benchmark baseline and dashboard
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: benchmark-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Schema throughput regression gate
    runs-on: ubuntu-latest
    permissions:
      contents: ${{ github.ref == 'refs/heads/main' && 'write' || 'read' }}
      deployments: ${{ github.ref == 'refs/heads/main' && 'write' || 'none' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo rm -f /etc/apt/sources.list.d/*.list && sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true && sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 clang libclang-dev

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Run schema throughput benchmark
        run: FORMAT=github-action-benchmark ruby -Ilib benchmark/schema_throughput.rb > benchmark_results.json

      - name: Compare benchmark results and update dashboard
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Schema throughput p95 latency
          tool: customSmallerIsBetter
          output-file-path: benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: 105%
          fail-threshold: 105%
          fail-on-alert: true
          auto-push: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish_dashboard) }}
