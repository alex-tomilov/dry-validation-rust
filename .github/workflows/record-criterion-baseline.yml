name: Record Criterion Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-criterion-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record Criterion baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Setup Ruby for rb-sys
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Expose Ruby shared library
        run: echo "LD_LIBRARY_PATH=$(ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch(%q[libdir])')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
          cache-workspaces: ext/dry_validation_rust -> target

      - name: Run Criterion benchmarks
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/criterion-target
        run: cargo bench --locked --manifest-path ext/dry_validation_rust/Cargo.toml --bench plan_compile --bench coercion --bench predicates -- --profile-time 2 --sample-size 10

      - name: Record Criterion baseline
        run: script/record-criterion-baseline "$RUNNER_TEMP/criterion-target/criterion" "$RUNNER_TEMP/baseline.json"

      - name: Upload Criterion baseline
        uses: actions/upload-artifact@v7
        with:
          name: criterion-baseline
          path: ${{ runner.temp }}/baseline.json
          if-no-files-found: error
