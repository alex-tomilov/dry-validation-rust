name: Container

on:
  pull_request:
  push:
    tags:
      - "build-week-*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      competition_tag:
        description: Competition convenience tag to publish
        required: true
        default: build-week-2026
        type: choice
        options:
          - build-week-2026

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  pull-request:
    name: Build and smoke-test PR image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Linux amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: dry-validation-rust:pr
          build-args: |
            VCS_REF=${{ github.sha }}-pr

      - name: Smoke-test local PR image
        run: script/docker-smoke --skip-build --tag dry-validation-rust:pr --platform linux/amd64

  publish:
    name: Publish Linux amd64 image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/build-week-') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.metadata.outputs.tags }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate publication trigger
        id: publication
        env:
          COMPETITION_TAG: ${{ inputs.competition_tag }}
        run: |
          competition_tag=""

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${COMPETITION_TAG}" == "build-week-2026" ]]
            competition_tag="${COMPETITION_TAG}"
          elif [[ "${GITHUB_REF}" == refs/tags/build-week-* ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^build-week-[0-9]{4}([.-][0-9A-Za-z.-]+)?$ ]]
            competition_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          else
            printf '%s\n' 'Refusing publication from an unsupported event or ref.' >&2
            exit 1
          fi

          printf 'competition_tag=%s\n' "${competition_tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR with the GitHub token
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and OCI labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=${{ steps.publication.outputs.competition_tag }},enable=${{ steps.publication.outputs.competition_tag != '' }}
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Linux amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}

  verify-published:
    name: Pull digest and smoke-test published image
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REFERENCE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
      PUBLISHED_TAGS: ${{ needs.publish.outputs.tags }}
      PUBLISHED_DIGEST: ${{ needs.publish.outputs.digest }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout verification script without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR for the clean pull job
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published image by digest
        run: docker pull "${IMAGE_REFERENCE}"

      - name: Smoke-test the pulled digest without network access
        run: script/docker-smoke --skip-build --tag "${IMAGE_REFERENCE}" --platform linux/amd64

      - name: Record published references
        if: always()
        run: |
          {
            printf '%s\n' '## GHCR judge image'
            printf -- '- Image: `%s`\n' "${IMAGE_REFERENCE}"
            printf -- '- Digest: `%s`\n' "${PUBLISHED_DIGEST}"
            printf -- '- Platform: `linux/amd64`\n'
            printf -- '- Workflow: %s\n' "${WORKFLOW_URL}"
            printf '%s\n' '### Published tags'
            while IFS= read -r tag; do
              [[ -z "${tag}" ]] || printf -- '- `%s`\n' "${tag}"
            done <<< "${PUBLISHED_TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"
