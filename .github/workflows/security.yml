name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo rm -f /etc/apt/sources.list.d/*.list && sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true && sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 clang libclang-dev

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
          cache-workspaces: ext/dry_validation_rust -> target

      - name: Verify lockfiles are present
        run: |
          test -f Gemfile.lock
          test -f ext/dry_validation_rust/Cargo.lock

      - name: Audit Ruby dependencies
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1

      - name: Audit Rust dependencies
        run: |
          cd ext/dry_validation_rust
          cargo audit --deny warnings

      - name: Verify Cargo lockfile build
        run: cargo check --locked --manifest-path ext/dry_validation_rust/Cargo.toml

  cargo-vet:
    name: Rust supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
          cache-workspaces: ext/dry_validation_rust -> target

      - name: Install cargo-vet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet@0.10.0

      - name: Verify Rust dependency audits
        run: cargo vet --locked

  cargo-deny:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ext/dry_validation_rust/Cargo.toml

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ruby

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4.37.4
