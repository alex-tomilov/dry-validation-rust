name: Compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-upstream-preflight:
    name: Pinned upstream preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0

      - name: Install pinned upstream references
        run: |
          gem install dry-validation -v 1.11.1 --no-document
          gem install dry-schema -v 1.16.0 --no-document

      - name: Compile native extension
        run: bundle exec rake compile
