name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby-integration:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ruby:
          - "3.3"
          - "3.4"
          - "3.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Install native build prerequisites on macOS
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: RuboCop
        run: bundle exec rubocop

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Run Ruby tests with warnings
        run: bundle exec rake test

      - name: Audit source package and clean install
        run: bundle exec rake package:audit

  rust-quality:
    name: Rust quality on ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - 1.85.0
          - stable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Setup Ruby for rb-sys
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path ext/dry_validation_rust/Cargo.toml

      - name: Run Rust tests
        run: cargo test --locked --manifest-path ext/dry_validation_rust/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path ext/dry_validation_rust/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Check Rust lockfile build
        run: cargo check --locked --manifest-path ext/dry_validation_rust/Cargo.toml

  loading-modes:
    name: Loading modes and installed gem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Safe side-by-side entrypoint
        run: |
          ruby -Ilib -e 'require "dry/validation/rust"; abort "unexpected exact alias" if Dry::Validation.const_defined?(:Contract, false)'

      - name: Exact compatibility entrypoint
        run: |
          ruby -Ilib -e 'require "dry/validation"; contract = Class.new(Dry::Validation::Contract) { params { required(:age).value(:integer) } }; result = contract.new.call("age" => "21"); abort result.errors.to_h.inspect unless result.to_h == {age: 21}'

      - name: Conflict detection for exact mode
        run: |
          ruby -Ilib -e 'module Dry; module Schema; end; end; begin; require "dry/validation"; rescue LoadError => error; abort error.message unless error.message.include?("cannot both own Dry::Schema"); exit 0; end; abort "expected exact-mode conflict"'

      - name: Built gem installation smoke
        run: bundle exec rake package:audit
