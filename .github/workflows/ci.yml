name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-fallback:
    name: Source fallback on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites on Linux
        if: runner.os == 'Linux'
        run: sudo rm -f /etc/apt/sources.list.d/*.list && sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true && sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 clang libclang-dev

      - name: Install native build prerequisites on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install native build prerequisites on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --no-progress --yes
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
          cache-workspaces: ext/dry_validation_rust -> target

      - name: Install extension build dependency
        run: gem install rb_sys --version '~> 0.9' --no-document

      - name: Build source gem
        run: gem build dry-validation-rust.gemspec

      - name: Install source gem
        shell: bash
        run: gem install --local dry-validation-rust-*.gem --platform ruby --no-document

      - name: Require installed source gem
        run: ruby -e 'require "dry/validation/rust"; puts "OK"'

  ruby-integration:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ruby:
          - "3.3"
          - "3.4"
          - "3.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites on Linux
        if: runner.os == 'Linux'
        run: sudo rm -f /etc/apt/sources.list.d/*.list && sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true && sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 clang libclang-dev

      - name: Install native build prerequisites on macOS
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install llvm

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
          components: rustfmt, clippy
          cache-workspaces: ext/dry_validation_rust -> target
          cache-key: ruby-native-${{ runner.arch }}-v2

      - name: RuboCop
        run: bundle exec rubocop

      - name: Verify generated predicate sources
        run: bundle exec rake generate:predicates:check

      - name: Check YARD documentation
        run: bundle exec yard --fail-on-warning

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Run Ruby tests with warnings
        run: bundle exec rake test

      - name: Audit source package and clean install
        run: bundle exec rake package:audit

  rust-quality:
    name: Rust quality on ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - 1.75.0
          - stable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo rm -f /etc/apt/sources.list.d/*.list && sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true && sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 clang libclang-dev

      - name: Setup Ruby for rb-sys
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Expose Ruby shared library
        run: echo "LD_LIBRARY_PATH=$(ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch(%q[libdir])')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          cache-workspaces: ext/dry_validation_rust -> target

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path ext/dry_validation_rust/Cargo.toml

      - name: Run Rust tests
        run: cargo test --locked --manifest-path ext/dry_validation_rust/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path ext/dry_validation_rust/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Check Rust lockfile build
        run: cargo check --locked --manifest-path ext/dry_validation_rust/Cargo.toml

      - name: Check Rust package manifest
        run: cargo package --list --manifest-path ext/dry_validation_rust/Cargo.toml

  native-benchmarks:
    name: Criterion regression gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo rm -f /etc/apt/sources.list.d/*.list && sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true && sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 clang libclang-dev

      - name: Setup Ruby for rb-sys
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Expose Ruby shared library
        run: echo "LD_LIBRARY_PATH=$(ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch(%q[libdir])')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
          cache-workspaces: ext/dry_validation_rust -> target

      - name: Load the main Criterion baseline for pull requests
        id: criterion-baseline
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          if git cat-file -e FETCH_HEAD:benchmark/baseline.json; then
            git show FETCH_HEAD:benchmark/baseline.json > "$RUNNER_TEMP/criterion-baseline.json"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif test -f benchmark/baseline.json; then
            cp benchmark/baseline.json "$RUNNER_TEMP/criterion-baseline.json"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Criterion baseline yet; run Record Criterion Baseline and commit benchmark/baseline.json to enable the gate." >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Benchmark candidate
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/candidate-target
        run: cargo bench --locked --manifest-path ext/dry_validation_rust/Cargo.toml --bench plan_compile --bench coercion --bench predicates -- --profile-time 2 --sample-size 10

      - name: Reject Criterion regressions above five percent
        if: github.event_name == 'pull_request' && steps.criterion-baseline.outputs.available == 'true'
        run: ruby script/compare-criterion-baselines "$RUNNER_TEMP/criterion-baseline.json" "$RUNNER_TEMP/candidate-target/criterion"

      - name: Upload Criterion reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-benchmarks
          path: ${{ runner.temp }}/candidate-target/criterion
          if-no-files-found: warn
          retention-days: 30

  memory-regression:
    name: Ruby allocation regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo rm -f /etc/apt/sources.list.d/*.list && sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true && sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 clang libclang-dev

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
          cache-workspaces: ext/dry_validation_rust -> target

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Load the main allocation baseline for pull requests
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          if git cat-file -e FETCH_HEAD:benchmark/baseline_allocations.json; then
            git show FETCH_HEAD:benchmark/baseline_allocations.json > "$RUNNER_TEMP/baseline_allocations.json"
          else
            cp benchmark/baseline_allocations.json "$RUNNER_TEMP/baseline_allocations.json"
          fi

      - name: Check Ruby allocations against main
        env:
          MEMORY_REGRESSION: "1"
          ALLOCATION_BASELINE_PATH: ${{ github.event_name == 'pull_request' && format('{0}/baseline_allocations.json', runner.temp) || 'benchmark/baseline_allocations.json' }}
        run: bundle exec ruby -Itest test/memory_regression_test.rb

  loading-modes:
    name: Loading modes and installed gem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo rm -f /etc/apt/sources.list.d/*.list && sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true && sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 clang libclang-dev

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
          cache-workspaces: ext/dry_validation_rust -> target

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Safe side-by-side entrypoint
        run: |
          ruby -Ilib -e 'require "dry/validation/rust"; abort "unexpected exact alias" if Dry::Validation.const_defined?(:Contract, false)'

      - name: Exact compatibility entrypoint
        run: |
          ruby -Ilib -e 'require "dry/validation"; contract = Class.new(Dry::Validation::Contract) { params { required(:age).value(:integer) } }; result = contract.new.call("age" => "21"); abort result.errors.to_h.inspect unless result.to_h == {age: 21}'

      - name: Conflict detection for exact mode
        run: |
          ruby -Ilib -e 'module Dry; module Schema; end; end; begin; require "dry/validation"; rescue LoadError => error; abort error.message unless error.message.include?("cannot both own Dry::Schema"); exit 0; end; abort "expected exact-mode conflict"'

      - name: Built gem installation smoke
        run: bundle exec rake package:audit
