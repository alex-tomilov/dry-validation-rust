name: Fuzz

on:
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-preflight:
    name: Bounded fuzz preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Expose Ruby shared library
        run: echo "LD_LIBRARY_PATH=$(ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch(%q[libdir])')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Run plan-deserialization fuzz target
        working-directory: ext/dry_validation_rust/fuzz
        run: |
          cargo install cargo-fuzz --locked
          cargo fuzz run parse_plan -- -max_total_time=300

      - name: Upload fuzz corpus and crashes
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-corpus-and-crashes
          path: |
            ext/dry_validation_rust/fuzz/corpus
            ext/dry_validation_rust/fuzz/artifacts
          if-no-files-found: warn
