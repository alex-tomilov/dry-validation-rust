name: Pull Request Labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # This action reads changed-file metadata and the base branch's config;
      # it does not check out or execute pull request code.
      - uses: actions/labeler@v7

      - name: Synchronize no-changelog label
        uses: actions/github-script@v7
        with:
          script: |
            const params = { ...context.repo, pull_number: context.payload.pull_request.number };
            const { data: pr } = await github.rest.pulls.get(params);
            const files = await github.paginate(github.rest.pulls.listFiles, { ...params, per_page: 100 });
            if (files.length !== pr.changed_files) {
              throw new Error('Incomplete PR file list; refusing to change no-changelog label.');
            }
            const changed = files.some(file =>
              file.filename === 'CHANGELOG.md' || file.previous_filename === 'CHANGELOG.md');
            const labeled = pr.labels.some(label => label.name === 'no-changelog');
            const issue = { ...context.repo, issue_number: pr.number };
            if (!changed && !labeled) {
              await github.rest.issues.addLabels({ ...issue, labels: ['no-changelog'] });
            } else if (changed && labeled) {
              await github.rest.issues.removeLabel({ ...issue, name: 'no-changelog' });
            }

  changelog:
    needs: label
    uses: ./.github/workflows/changelog.yml
    permissions:
      contents: read
      pull-requests: read
