name: Native Gems

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-gems-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-gem:
    name: Native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            target: x86_64-unknown-linux-gnu
          - platform: aarch64-linux
            target: aarch64-unknown-linux-gnu
          - platform: x86_64-darwin
            target: x86_64-apple-darwin
          - platform: arm64-darwin
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}
          cache-workspaces: ext/dry_validation_rust -> target

      - name: Build native platform gem
        run: |
          # rb-sys-dock bind-mounts this directory but does not create it.
          mkdir -p "${CARGO_HOME:-${HOME}/.cargo}/registry"

          bundle exec rb-sys-dock \
            --platform ${{ matrix.platform }} \
            --ruby-versions 3.3 \
            --mount-toolchains \
            --build

      - name: Upload native platform gem
        uses: actions/upload-artifact@v7
        with:
          name: dry-validation-rust-${{ matrix.platform }}
          path: pkg/*-${{ matrix.platform }}.gem
          if-no-files-found: error
