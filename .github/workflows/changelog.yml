name: Changelog

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    steps:
      # Read metadata only: the caller runs on pull_request_target.
      - name: Check changelog update or label
        uses: actions/github-script@v7
        with:
          script: |
            const params = { ...context.repo, pull_number: context.payload.pull_request.number };
            const { data: pr } = await github.rest.pulls.get(params);
            const files = await github.paginate(github.rest.pulls.listFiles, { ...params, per_page: 100 });
            if (files.length !== pr.changed_files) {
              throw new Error('Incomplete PR file list; cannot check changelog.');
            }
            const changed = files.some(file =>
              file.filename === 'CHANGELOG.md' || file.previous_filename === 'CHANGELOG.md');
            if (!changed && !pr.labels.some(label => label.name === 'no-changelog')) {
              core.setFailed('Update CHANGELOG.md or apply the no-changelog label.');
            }
