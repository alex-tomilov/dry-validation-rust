name: Performance regression
description: Report a reproducible regression or unexpectedly expensive supported workload.
title: "[Performance]: "
labels:
  - "type:performance"
  - "area:benchmark"
  - "status:needs-reproduction"
assignees: []
body:
  - type: input
    id: gem_version
    attributes:
      label: Gem version or commit
    validations:
      required: true
  - type: input
    id: runtime_versions
    attributes:
      label: Ruby and Rust versions
      description: Include `ruby --version` and `rustc --version` for source builds.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware and platform
      description: Include CPU, core count, RAM, OS, architecture, and power/virtualization constraints.
    validations:
      required: true
  - type: input
    id: iterations
    attributes:
      label: Warmup and measured iterations
      placeholder: 10,000 warmup; 500,000 measured; 5 independent runs
    validations:
      required: true
  - type: textarea
    id: benchmark
    attributes:
      label: Reproducible benchmark script
      description: Provide a complete runnable script with representative contract and input data.
      render: ruby
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Benchmark command
      description: Include environment variables and every command used for the comparison.
      render: shell
    validations:
      required: true
  - type: textarea
    id: before_results
    attributes:
      label: Before numbers
      description: Include all baseline runs, units, and summary statistics.
      render: text
    validations:
      required: true
  - type: textarea
    id: after_results
    attributes:
      label: After numbers
      description: Include all regression runs, units, and summary statistics.
      render: text
    validations:
      required: true
  - type: textarea
    id: memory
    attributes:
      label: RSS and allocation results
      description: Include peak/resident memory and Ruby allocation counts where relevant, or explain why they were not measured.
      render: text
    validations:
      required: true
  - type: textarea
    id: semantic_check
    attributes:
      label: Semantic equivalence check
      description: Show that compared implementations return equivalent values/errors for the measured workload.
    validations:
      required: true
  - type: textarea
    id: flamegraph
    attributes:
      label: Flamegraph
      description: Attach a flamegraph or link to it if available; otherwise state that none was captured.
    validations:
      required: true
  - type: textarea
    id: interpretation
    attributes:
      label: Expected behavior and interpretation
      description: Explain the suspected regression, baseline, variance, and why the workload is representative.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I included warmup, multiple measured runs, hardware details, and raw results.
          required: true
        - label: I did not infer a general performance claim from a single synthetic number.
          required: true
