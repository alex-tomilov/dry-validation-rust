name: Feature request
description: Propose a focused capability or compatibility-surface addition.
title: "[Feature]: "
labels:
  - "type:feature"
  - "status:needs-design"
assignees: []
body:
  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      description: Tell us whether the proposal should match an upstream behavior or add a project-specific capability.
      options:
        - Upstream parity
        - New feature
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the concrete user problem without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: proposed_api
    attributes:
      label: Proposed API
      description: Show the intended Ruby API and result where useful.
      render: ruby
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: For upstream parity, cite the pinned versions and behavior. For a new feature, explain interaction with supported semantics.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds and why they are insufficient.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Suggested scope and acceptance criteria
      description: Describe the smallest coherent version of the request and how it could be verified.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I checked the compatibility matrix and existing issues.
          required: true
        - label: This request does not rely on silently accepting unsupported DSL behavior.
          required: true
